<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Folha não encontrada · Marcelo Machuca</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<style>
:root{--ink:#050B16;--fg:#EAF4FF;--fg-2:#BFD2E6;--mute:#869DB6;--line:rgba(160,205,245,.2);--cyan:#A7DBFF}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--ink);color:var(--fg)}
body{display:grid;place-items:center;min-height:100vh;padding:24px max(16px,env(safe-area-inset-left,0px));font:400 17px/1.55 "Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;background-image:linear-gradient(rgba(160,205,245,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(160,205,245,.045) 1px,transparent 1px);background-size:32px 32px}
main{max-width:520px;padding:32px;border:1px solid var(--line);background:rgba(6,15,30,.86)}
p{margin:0}
.code{font:500 12px/1.4 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
h1{margin:12px 0 8px;font-size:40px;line-height:1;letter-spacing:-.02em}
.en{margin-top:4px;color:var(--fg-2)}
.links{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
a{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border:1px solid var(--fg-2);color:var(--fg);text-decoration:none;font-weight:600}
a:hover,a:focus-visible{border-color:var(--cyan);color:var(--cyan)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
</style>
</head>
<body>
<main>
  <p class="code">Erro 404 · folha fora da planta</p>
  <h1>Folha não encontrada</h1>
  <p>Esta página não existe.</p>
  <p class="en" lang="en">This page does not exist.</p>
  <p class="links"><a href="/">Voltar ao início</a><a href="/en/" lang="en" hreflang="en">Go to the English version</a></p>
</main>
</body>
</html>
